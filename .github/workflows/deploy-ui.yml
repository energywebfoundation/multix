name: Deploy Multix UI

on:
  push:
    branches:
      - main
    paths:
      - 'packages/ui/**/*'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy from'
        required: false
        type: string
        default: 'main'

jobs:
  deploy:
    name: Build and Deploy UI to S3/CloudFront
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Configure AWS credentials for Cloudfront & S3
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build UI
        run: yarn workspace multix-ui build

      - name: Upload to S3
        run: |
          # Upload static assets (JS/CSS/images) with long cache
          aws s3 sync packages/ui/build/ s3://${{ secrets.BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "service-worker.js" \
            --exclude "manifest.json" \
            --exclude "robots.txt"

          # Upload HTML and other files with no cache
          aws s3 sync packages/ui/build/ s3://${{ secrets.BUCKET_NAME }}/ \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "service-worker.js" \
            --include "manifest.json" \
            --include "robots.txt"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --paths '/*' --query 'Invalidation.Id' --output text); while [[ $(aws cloudfront get-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --id $INVALIDATION_ID --query 'Invalidation.Status' --output text) != "Completed" ]]; do echo "Waiting for invalidation to complete..."; sleep 30; done; echo "Invalidation completed."

      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket:** ${{ secrets.BUCKET_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Distribution:** ${{ secrets.CLOUDFRONT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://multix.energywebx.com" >> $GITHUB_STEP_SUMMARY
